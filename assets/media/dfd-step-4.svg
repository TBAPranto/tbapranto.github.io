<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 308" role="img" aria-labelledby="title desc">
<title id="title">Inspect the exported graph</title><desc id="desc">Node 1 is Customer and node 2 is Check request. The example edge references the two IDs and keeps the label request.</desc>
<defs><marker id="arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 3.5L0 7Z" fill="#263fca"/></marker></defs>
<rect width="540" height="308" rx="12" fill="#eeefdf"/>
<text x="22" y="31" fill="#22302c" font-family="system-ui, sans-serif" font-size="20" font-weight="600" text-anchor="start">Inspect the exported graph</text><text x="22" y="53" fill="#475649" font-family="monospace" font-size="12" font-weight="600" text-anchor="start">NODE IDS IN ONE EXAMPLE EDGE</text><rect x="22" y="68" width="496" height="176" rx="8" fill="#f8f8ed" stroke="#b8bfb0" stroke-width="1.4"/><rect x="48" y="133" width="153" height="74" rx="6" fill="#e9ebfd" stroke="#263fca" stroke-width="1.4"/><rect x="323" y="133" width="166" height="74" rx="17" fill="#e5ecbf" stroke="#263fca" stroke-width="1.4"/><path d="M202 169L322 169" fill="none" stroke="#263fca" stroke-width="2" marker-end="url(#arr)"/><text x="124" y="117" fill="#263fca" font-family="monospace" font-size="14" font-weight="700" text-anchor="middle">src: 1</text><text x="408" y="117" fill="#263fca" font-family="monospace" font-size="14" font-weight="700" text-anchor="middle">dst: 2</text><text x="124" y="176" fill="#22302c" font-family="system-ui, sans-serif" font-size="19" font-weight="600" text-anchor="middle">Customer</text><text x="406" y="176" fill="#22302c" font-family="system-ui, sans-serif" font-size="19" font-weight="600" text-anchor="middle">Check request</text><text x="262" y="155" fill="#22302c" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">request</text><text x="23" y="282" fill="#30413a" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="start">The edge references the nodes by ID and keeps the flow label.</text>
</svg>
