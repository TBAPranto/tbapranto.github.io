<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="title desc" font-family="Arial, Helvetica, sans-serif">
  <title id="title">Reading a data flow diagram as a graph</title>
  <desc id="desc">Illustrative data flow diagram. Customer, node 1, sends a request to Check request, node 2. That process sends an entry to Request log, node 3. The first directed edge stores source ID 1, destination ID 2 and the flow label request.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="m0 0 9 4-9 4z" fill="#445987"/></marker>
  </defs>
  <rect width="640" height="420" rx="10" fill="#e5e8e1"/>
  <text x="28" y="55" fill="#263c34" font-size="33" font-weight="700" letter-spacing="-1">From diagram to directed graph</text>
  <path d="M29 79h582" stroke="#a6b5a6"/>
  <g text-anchor="middle" fill="#425d4c" font-family="monospace" font-size="17" font-weight="700">
    <text x="100" y="125">ID 1</text><text x="320" y="125">ID 2</text><text x="540" y="125">ID 3</text>
  </g>
  <!-- Three DFD node types and two labelled, directed information flows. -->
  <rect x="35" y="148" width="130" height="75" fill="#faf9ef" stroke="#596c5d" stroke-width="2.5"/>
  <rect x="252" y="140" width="136" height="91" rx="23" fill="#d6e4ac" stroke="#61754f" stroke-width="2.5"/>
  <path d="M606 148H473v75h133M487 148v75" fill="#e4e5fb" stroke="#747aa1" stroke-width="2.5"/>
  <g text-anchor="middle" font-weight="700" fill="#243b32">
    <text x="100" y="193" font-size="23">Customer</text>
    <text x="320" y="179" font-size="23">Check</text><text x="320" y="205" font-size="23">request</text>
    <text x="548" y="180" font-size="21">Request</text><text x="548" y="204" font-size="21">log</text>
  </g>
  <g fill="none" stroke="#445987" stroke-width="2.8" marker-end="url(#arrow)">
    <path d="M166 186h83"/><path d="M389 186h81"/>
  </g>
  <g fill="#374975" font-size="17" text-anchor="middle">
    <text x="207" y="174">request</text><text x="430" y="174">entry</text>
  </g>
  <g fill="#4c5c53" font-size="18" text-anchor="middle">
    <text x="100" y="261">Entity</text><text x="320" y="261">Process</text><text x="540" y="261">Data store</text>
  </g>
  <rect x="28" y="293" width="584" height="104" rx="6" fill="#223a32"/>
  <text x="48" y="326" fill="#cde3b1" font-size="18" font-weight="700">First edge in JSON</text>
  <text x="48" y="367" fill="#f6f6ec" font-family="monospace" font-size="20">{"src": 1, "dst": 2, "label": "request"}</text>
</svg>
